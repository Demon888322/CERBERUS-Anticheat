name: CERBERUS
version: '${project.version}'
main: dev.cerberus.CerberusPlugin
api-version: '1.20'
description: Configurable anti-cheat checks using Paper and PacketEvents.
author: CERBERUS
commands:
  cerberus:
    description: CERBERUS administration and status commands.
    usage: '/cerberus <help|info|reload>'
    aliases: [cerb]
    permission: cerberus.admin
  cerberustempban:
    description: Internal console command for CERBERUS timed bans.
    permission: cerberus.admin
permissions:
  cerberus.admin:
    description: Receive CERBERUS violation alerts and configuration messages.
    default: op
